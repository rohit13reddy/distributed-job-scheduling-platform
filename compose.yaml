
services:
  postgres:
    image: postgres:17
    container_name: scheduler-postgres
    environment:
      POSTGRES_DB: jobscheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d jobscheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: scheduler-api:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobscheduler
      SPRING_DATASOURCE_USERNAME: scheduler
      SPRING_DATASOURCE_PASSWORD: local_dev_password
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: scheduler-api:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobscheduler
      SPRING_DATASOURCE_USERNAME: scheduler
      SPRING_DATASOURCE_PASSWORD: local_dev_password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
